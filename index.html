<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#292724"><title>BRAND NOTE REBOOT 56</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f3ef;color:#292724;margin:0}header{background:#292724;color:#fff;padding:18px 22px}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:0;border-radius:10px;padding:11px 16px;background:#292724;color:#fff;cursor:pointer;margin:4px}.secondary{background:#e9e5df;color:#292724}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #d7d1c8;border-radius:9px;margin:6px 0 12px;font-size:15px}textarea{min-height:90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.brand{cursor:pointer}.pill{display:inline-block;background:#eee8df;border-radius:99px;padding:4px 9px;font-size:12px;margin:2px}.catpill{display:inline-flex;align-items:center;gap:5px;background:#eee8df;border-radius:99px;padding:5px 10px;font-size:13px;margin:2px;font-weight:600}.muted{color:#777;font-size:13px}.hidden{display:none}.hero{font-size:28px}.small{font-size:12px}.ok{background:#e6f4ea;color:#23633a}.err{background:#fdecec;color:#9b2c2c}.loginbox{border:2px solid #d7d1c8}.notice{background:#f7f3ec;border-radius:10px;padding:12px;font-size:14px}</style></head><body><header><div class="wrap"><b>BRAND NOTE</b>　REBOOT 56 / v1.1 ☁️</div></header><div class="wrap"><div id="home"><div class="card"><div class="hero">これまでのブランド学習を、全部ここへ。</div><p>Excelから移行済み。これからはアプリに記録していく想定です。</p><button onclick="show('add')">＋ 新しいブランド</button><button class="secondary" onclick="backup()">JSONバックアップ</button><button class="secondary" onclick="exportReboot()">🧠 REBOOT 56へ送る</button></div><div id="loginCard" class="card loginbox"><h2>☁️ クラウド同期</h2><div class="notice">PCとスマホで同じブランドメモを使うため、まずBRAND NOTEのアカウントを作ります。<br>ここに入力するパスワードは、ChatGPTには送らないでください。</div><label>メールアドレス<input id="email" type="email" autocomplete="email" placeholder="あなたのメールアドレス"></label><label>パスワード<input id="password" type="password" autocomplete="new-password" placeholder="6文字以上"></label><button onclick="signUp()">新規登録</button><button onclick="signIn()">ログイン</button><p id="loginMsg" class="muted"></p></div><div id="cloudCard" class="card hidden"><b>☁️ クラウド同期</b><span id="syncStatus" class="pill" style="margin-left:8px">接続確認中…</span><div style="margin-top:8px"><button class="secondary" onclick="syncFromCloud()">今すぐ同期</button><button class="secondary" onclick="signOut()">ログアウト</button></div></div><div class="grid" id="stats"></div><div style="margin:8px 0 10px;color:#777">主力カテゴリーをAIで表示</div><div id="catButtons" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px"></div><input id="search" oninput="renderList()" placeholder="🔎 ブランド名・国・キーワードで検索"><div class="card"><h3>ブランド一覧</h3><div id="list"></div></div></div><div id="add" class="hidden"><div class="card"><h2>新しいブランド</h2><input id="brandName" placeholder="例：John Lobb"><button onclick="research()">🔎 基本情報を登録</button><button class="secondary" onclick="show('home')">戻る</button></div></div><div id="confirm" class="hidden"><div class="card"><h2>基本情報を確認</h2><div id="researchResult"></div><button onclick="saveResearch()">✓ 保存</button><button class="secondary" onclick="show('add')">戻る</button></div></div><div id="detail" class="hidden"></div></div><script src="config.js"></script><script>const initial=[];const key="brand_note_v1_local";let db=JSON.parse(localStorage.getItem(key)||"null")||initial,draft=null,currentUser=null,sb=null,CLOUD_ENABLED=false;function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function show(id){["home","add","confirm","detail"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden");if(id==="home"){renderStats();renderCats();renderList()}}function saveLocal(){localStorage.setItem(key,JSON.stringify(db))}function setStatus(msg,cls=""){const e=document.getElementById("syncStatus");if(e){e.textContent=msg;e.className="pill "+cls}}function loginMsg(t){const e=document.getElementById("loginMsg");if(e)e.textContent=t}function setLoggedIn(user){currentUser=user;document.getElementById("loginCard").classList.add("hidden");document.getElementById("cloudCard").classList.remove("hidden")}function setLoggedOut(){currentUser=null;document.getElementById("loginCard").classList.remove("hidden");document.getElementById("cloudCard").classList.add("hidden")}async function loadSupabase(){if(!window.BRAND_NOTE_CONFIG?.url||!window.BRAND_NOTE_CONFIG?.anonKey){loginMsg("Supabase設定が読み込めていません。config.jsを確認してください。");return false}await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)}).catch(()=>null);if(!window.supabase){loginMsg("クラウド接続ライブラリの読み込みに失敗しました。ページを再読み込みしてください。");return false}sb=window.supabase.createClient(window.BRAND_NOTE_CONFIG.url,window.BRAND_NOTE_CONFIG.anonKey);CLOUD_ENABLED=true;return true}async function init(){renderStats();renderCats();renderList();const ok=await loadSupabase();if(!ok)return;const {data}=await sb.auth.getSession();if(data.session){setLoggedIn(data.session.user);await syncFromCloud(true)}else setLoggedOut();sb.auth.onAuthStateChange(async(_event,session)=>{if(session){setLoggedIn(session.user);await syncFromCloud(true)}else setLoggedOut()})}async function signUp(){if(!CLOUD_ENABLED){loginMsg("まだクラウド接続が完了していません。");return}const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||password.length<6){loginMsg("メールアドレスと6文字以上のパスワードを入力してください。");return}const {data,error}=await sb.auth.signUp({email,password});if(error){loginMsg(error.message);return}if(data.session){setLoggedIn(data.user);await syncFromCloud(true)}else loginMsg("登録しました。確認メールが届いた場合は、メールのリンクを開いてからログインしてください。")}async function signIn(){if(!CLOUD_ENABLED){loginMsg("まだクラウド接続が完了していません。");return}const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)loginMsg(error.message);else{setLoggedIn(data.user);await syncFromCloud(true)}}async function signOut(){if(sb)await sb.auth.signOut();setLoggedOut()}async function syncFromCloud(silent=false){if(!sb||!currentUser)return;setStatus("☁️ 同期中…");try{const {data,error}=await sb.from("brand_note_data").select("payload").eq("user_id",currentUser.id).maybeSingle();if(error)throw error;if(data?.payload?.brands){db=data.payload.brands;saveLocal()}else await saveToCloud();renderStats();renderCats();renderList();setStatus("☁️ 同期済み","ok")}catch(e){console.error(e);setStatus("同期エラー","err");if(!silent)alert("クラウド同期に失敗しました。\n"+e.message)}}async function saveToCloud(){if(!sb||!currentUser){saveLocal();return}saveLocal();const {error}=await sb.from("brand_note_data").upsert({user_id:currentUser.id,payload:{brands:db},updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)throw error;setStatus("☁️ 保存・同期済み","ok")}async function persist(){saveLocal();if(sb&&currentUser){try{await saveToCloud()}catch(e){console.error(e);setStatus("端末には保存済み／クラウド未同期","err")}}}function renderStats(){let v=db.reduce((a,b)=>a+(b.visits||[]).length,0),r=db.reduce((a,b)=>a+(b.visits||[]).filter(x=>x.revisit==="yes").length,0);document.getElementById("stats").innerHTML=`<div class="card"><b>${db.length}</b><div class="muted">登録ブランド</div></div><div class="card"><b>${v}</b><div class="muted">訪問記録</div></div><div class="card"><b>${r}</b><div class="muted">また行きたい</div></div>`}const CAT_ICON={宝飾:"💎",時計:"⌚",革小物:"👝",バッグ:"👜",靴:"👞",文房具:"🖋️",馬具:"🐎",その他:"🏷️"};function catLabel(c){return `${CAT_ICON[c]||"🏷️"} ${c||"その他"}`}function renderCats(){const cats=["","宝飾","時計","革小物","バッグ","靴","文房具","馬具","その他"],current=document.getElementById("cat")?.value||"";document.getElementById("catButtons").innerHTML=cats.map(c=>`<button class="${current===c?"":"secondary"}" style="padding:8px 12px" onclick="setCat('${c}')">${c?catLabel(c):"すべて"}</button>`).join("")}function setCat(c){let h=document.getElementById("cat");if(!h){h=document.createElement("input");h.type="hidden";h.id="cat";document.body.appendChild(h)}h.value=c;renderCats();renderList()}function renderList(){const q=(document.getElementById("search")?.value||"").toLowerCase(),c=(document.getElementById("cat")?.value||"");const a=db.map((b,i)=>({b,i})).filter(x=>(!c||x.b.category===c)&&(x.b.name+" "+x.b.country+" "+x.b.summary+" "+(x.b.philosophy||"")+" "+(x.b.category||"")).toLowerCase().includes(q));document.getElementById("list").innerHTML=a.length?a.map(x=>`<div class="card brand" onclick="openBrand(${x.i})"><b>${esc(x.b.name)}</b><span class="pill">${esc(x.b.country)}</span><span class="pill">${esc(x.b.category||"その他")}</span>${x.b.visits?.length?`<span class="pill">${x.b.visits.length} visit</span>`:""}<div class="small" style="margin-top:8px">${catLabel(x.b.category||"その他")}</div><p class="muted">${esc(x.b.summary||"キャッチ未設定")}</p></div>`).join(""):"<p class='muted'>まだブランドがありません。クラウド移行後に20ブランドが表示されます。</p>"}function research(){const n=document.getElementById("brandName").value.trim();if(!n)return alert("ブランド名を入力してください");draft={name:n,country:"要確認",year:"要確認",founder:"要確認",origin:"要確認",philosophy:"要確認",products:"要確認",summary:"新規ブランド",visits:[],category:"その他"};document.getElementById("researchResult").innerHTML=fields(draft);show("confirm")}function fields(d){return `<label>国・地域<input id="c" value="${esc(d.country)}"></label><label>創業年<input id="y" value="${esc(d.year)}"></label><label>創業者<input id="f" value="${esc(d.founder)}"></label><label>起源<input id="o" value="${esc(d.origin)}"></label><label>理念<textarea id="p">${esc(d.philosophy)}</textarea></label><label>代表商品<textarea id="pr">${esc(d.products)}</textarea></label><label>一言で表すと<textarea id="s">${esc(d.summary)}</textarea></label>`}async function saveResearch(){draft.country=c.value;draft.year=y.value;draft.founder=f.value;draft.origin=o.value;draft.philosophy=p.value;draft.products=pr.value;draft.summary=s.value;db.push(draft);await persist();show("home")}function openBrand(i){const b=db[i],vs=b.visits||[];document.getElementById("detail").innerHTML=`<div class="card"><h2>${esc(b.name)}</h2><span class="pill">${esc(b.country)}</span><span class="catpill">AI分類：${catLabel(b.category||"その他")}</span><p><b>${esc(b.summary||"キャッチ未設定")}</b></p><div class="grid"><div><b>創業</b><br>${esc(b.year)}</div><div><b>創業者</b><br>${esc(b.founder)}</div><div><b>起源</b><br>${esc(b.origin)}</div></div><hr><h3>ブランドを知る</h3><p>${esc(b.philosophy)}</p><p><b>代表商品：</b>${esc(b.products)}</p></div><div class="card"><h3>訪問・体験を追加</h3><label>日付<input id="vd" placeholder="260925 / 2026-09-25"></label><label>場所<input id="vp" placeholder="例：銀座店"></label><label>感想<textarea id="vn"></textarea></label><label>また行きたい<select id="vr"><option value="">選択</option><option value="yes">はい</option><option value="no">今回はなし</option></select></label><button onclick="addVisit(${i})">保存して同期</button></div><div class="card"><h3>これまでの訪問</h3>${vs.length?vs.map(v=>`<div class="card"><b>${esc(v.date)} ${esc(v.place)}</b>${v.revisit==="yes"?'<span class="pill">また行きたい</span>':""}<p>${esc(v.note)}</p></div>`).join(""):"<p class='muted'>まだありません</p>"}</div><button class="secondary" onclick="show('home')">← 一覧</button>`;show("detail")}async function addVisit(i){db[i].visits=db[i].visits||[];db[i].visits.push({date:vd.value,place:vp.value,note:vn.value,revisit:vr.value});await persist();openBrand(i)}function exportReboot(){const visited=db.flatMap(b=>(b.visits||[]).map(v=>({brand:b.name,category:b.category||"その他",country:b.country,date:v.date,place:v.place,note:v.note,revisit:v.revisit})));const lines=["# REBOOT 56｜ブランド学習ログ","",`更新日：${new Date().toLocaleDateString("ja-JP")}`,"",`登録ブランド数：${db.length}`,`訪問記録数：${visited.length}`,""];visited.forEach(v=>{lines.push(`## ${v.brand}`,`- カテゴリー：${v.category}`,`- 国：${v.country||"未記録"}`,`- 訪問：${v.date||"日付未記録"} ${v.place||""}`,`- 感想：${v.note||"未記録"}`,`- また行きたい：${v.revisit==="yes"?"はい":"未選択/今回はなし"}`,"")});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/markdown;charset=utf-8"}));a.download="REBOOT56_ブランド学習ログ.md";a.click()}function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="brand_note_backup.json";a.click()}init();</script></body></html>
