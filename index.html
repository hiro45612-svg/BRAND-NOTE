}

    lines.push(`- 感想：${v.note||"未記録"}`);

    lines.push("");
  });
  const blob=new Blob([lines.join("\\n")],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="REBOOT56_ブランド学習ログ.md";a.click();
  alert("REBOOT 56用の学習ログを作りました。ChatGPT『人生リブート計画』に添付・貼り付けて、ちゃぴこレビューに使えます。");
}
